spring:
  application:
    name: kes-api
  datasource:
    url: jdbc:h2:mem:kesdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: password
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

server:
  port: 8080
  error:
    include-stacktrace: never

kes:
  jwt:
    secret: ${KES_JWT_SECRET}
    expirationMs: ${KES_JWT_EXPIRATION_MS}

logging:
  level:
    com.kes.api: DEBUG
    org.springframework.web: INFO
